# DATUM cloud worker.
#
# Trigger: the UTAG site DATUM tab calls utag-control datum_run, which
# sends a repository_dispatch with event_type datum-run, or a run can
# be started by hand from the GitHub Actions tab (workflow_dispatch).
# There is deliberately no schedule and no always-on server: one run
# works the pending datum_jobs queue, oldest first, then the runner
# is thrown away. Audio is uploaded to the private Supabase bucket
# and linked in UTAG; nothing audio is kept on the runner or pushed
# to the repo.
#
# Secrets (repo Settings > Secrets and variables > Actions, never in
# code): UTAG_SUPABASE_URL, UTAG_SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_KEY, UTAG_SITE_PASSWORD.

name: DATUM

on:
  repository_dispatch:
    types: [datum-run]
  workflow_dispatch:

concurrency:
  group: datum
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp requests

      - name: Work the DATUM queue
        run: python3 backend/datum/datum.py --queue --base-dir datum-downloads
        env:
          UTAG_SUPABASE_URL: ${{ secrets.UTAG_SUPABASE_URL }}
          UTAG_SUPABASE_ANON_KEY: ${{ secrets.UTAG_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UTAG_SITE_PASSWORD: ${{ secrets.UTAG_SITE_PASSWORD }}
