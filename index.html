<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTAG: Verified Music Metadata</title>
<meta name="description" content="UTAG is a growing database of verified music metadata: artists, releases, editions, artwork, and the evidence behind every record.">
