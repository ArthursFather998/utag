            echo "cookies written"
          else
            echo "no YOUTUBE_COOKIES secret, running without cookies"
          fi
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      - name: Run DATUM slow retry
        run: python3 backend/datum/datum.py --drip ${{ inputs.drip_batch || '50' }} --slow --shard 0 --shards 1 --base-dir datum-downloads
        env:
          UTAG_SUPABASE_URL: ${{ secrets.UTAG_SUPABASE_URL }}
          UTAG_SUPABASE_ANON_KEY: ${{ secrets.UTAG_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATUM_STORAGE: mega
          MEGA_REMOTE: mega-remote
          MEGA_ROOT: DATUM/SSDB
